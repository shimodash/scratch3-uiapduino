<?xml version="1.0" encoding="UTF-8"?>
<svg width="20px" height="20px" viewBox="0 0 20 20" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>usb-hid-white</title>
    <desc>USB mark for the UIAPduino connection badge. Drawn to match bluetooth-white.svg: 20x20, white, sits on a colored circle.</desc>
    <g id="usb-hid-white" stroke="none" fill="none" fill-rule="evenodd">
        <g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.4,10 L15.4,10"/>
