            <path d="M10.2,10 L12.6,14.8 L13.6,14.8"/>
        </g>
        <circle fill="#FFFFFF" cx="3.1" cy="10" r="2"/>
        <polygon fill="#FFFFFF" points="15.2,7.2 19.2,10 15.2,12.8"/>
        <rect fill="#FFFFFF" x="12.1" y="3.7" width="3" height="3" transform="rotate(45 13.6 5.2)"/>
